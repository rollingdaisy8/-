<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170f16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="행복 한 톨">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>행복 한 톨</title>
</head>
<body>
<main class="app">
  <header class="topbar">
    <p class="eyebrow">DAILY NOTE</p>
    <h1>행복 한 톨<span class="grain-mark" aria-hidden="true"></span></h1>
  </header>

  <section id="todayView" class="view active">
    <div class="date-edit">
      <label for="recordDate">기록 날짜</label>
      <input id="recordDate" type="date">
    </div>

    <div id="questions"></div>

    <button id="saveBtn" class="save-button" type="button">저장</button>
    <p id="saveStatus" class="save-status"></p>

    <section class="random-card">
      <div class="random-head">
        <div>
          <p class="eyebrow">A LITTLE GRAIN</p>
          <h2>오늘 다시 만난 한 톨</h2>
        </div>
        <button id="randomAgainBtn" class="text-button" type="button">다른 한 톨</button>
      </div>
      <p id="randomDate" class="random-date"></p>
      <p id="randomLabel" class="random-label"></p>
      <p id="randomText" class="random-text">아직 꺼내볼 한 톨이 없어.</p>
    </section>
  </section>

  <section id="storeView" class="view">
    <div class="section-head">
      <div>
        <p class="eyebrow">COLLECTION</p>
        <h2>행복곳간</h2>
      </div>
    </div>

    <div class="pantry-grid">
      <button class="pantry-card category-card card-emotion" data-q="q1"><span>감정</span><strong id="countQ1">0톨</strong></button>
      <button class="pantry-card category-card card-excitement" data-q="q2"><span>설렘·재미</span><strong id="countQ2">0톨</strong></button>
      <button class="pantry-card category-card card-gratitude" data-q="q3"><span>감사</span><strong id="countQ3">0톨</strong></button>
      <button class="pantry-card category-card card-heart" data-q="q4"><span>마음</span><strong id="countQ4">0톨</strong></button>
    </div>

    <section id="pantryDetail" class="pantry-detail hidden">
      <div class="pantry-detail-head">
        <div><p class="eyebrow">COLLECTION</p><h3 id="pantryTitle"></h3></div>
        <button id="closePantryBtn" class="text-button" type="button">닫기</button>
      </div>
      <div id="pantryList" class="pantry-list"></div>
    </section>
  </section>

  <section id="historyView" class="view">
    <div class="section-head">
      <div><p class="eyebrow">ARCHIVE</p><h2>지난 기록</h2></div>
    </div>

    <section class="backup-panel">
      <p class="backup-title">기록 백업</p>
      <p class="backup-help">내보내는 JSON에는 날짜와 1~4번의 한 톨 목록만 들어가.</p>
      <div class="backup-actions">
        <button id="exportBtn" class="secondary-button" type="button">전체 기록 저장</button>
        <button id="importBtn" class="secondary-button" type="button">백업 불러오기</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="backupStatus" class="save-status"></p>
    </section>

    <div id="historyList" class="history-list"></div>
    <p id="emptyHistory" class="empty">아직 저장된 기록이 없어.</p>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="todayView">오늘</button>
  <button class="nav-btn" data-view="storeView">행복곳간</button>
  <button class="nav-btn" data-view="historyView">기록</button>
</nav>

<script src="app.js"></script>
</body>
</html>
